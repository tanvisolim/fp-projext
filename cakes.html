<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>90° Cake Shop | Our Cakes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="cakes" id="top">

  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="eyebrow">OUR COLLECTION</div>
      <h1>Choose Your <span>Favourite Cake</span></h1>
      <p>Find the perfect cake for your celebration.</p>
    </section>

    <section class="section">
      <div class="filters">
        <button class="filter-btn active" data-category="All">All Cakes</button>
        <button class="filter-btn" data-category="Chocolate">Chocolate</button>
        <button class="filter-btn" data-category="Fruit">Fruit</button>
        <button class="filter-btn" data-category="Classic">Classic</button>
      </div>

      <div class="products" id="productList"></div>
      <p class="notice">Sample products and prices — edit these to match the actual shop menu (in script.js).</p>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="script.js"></script>
</body>
</html>
